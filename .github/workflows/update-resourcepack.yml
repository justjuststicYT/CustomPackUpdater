name: Resource-Pack veröffentlichen

# Startet automatisch, sobald eine ZIP in resourcepack/ hochgeladen oder ersetzt wird.
# Manuell startbar über den Tab "Actions" -> "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - "resourcepack/*.zip"
  workflow_dispatch:

# Nur die nötigen Rechte: Releases erstellen und latest.json/version.txt committen.
permissions:
  contents: write

# Nie zwei Veröffentlichungen gleichzeitig (verhindert doppelte Versionsnummern).
concurrency:
  group: resourcepack-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ZIP prüfen, SHA-256 und neue Version berechnen
        id: prepare
        run: python scripts/update_resourcepack.py prepare

      - name: GitHub Release erstellen
        id: release
        if: steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          FILE_NAME: ${{ steps.prepare.outputs.file_name }}
          SHA256: ${{ steps.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Die Release $TAG existiert bereits. Abbruch, damit nichts überschrieben wird."
            exit 1
          fi
          # Ab hier gilt die Release als "von diesem Lauf erstellt" (für das Aufräumen bei Fehlern).
          echo "created=true" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" "resourcepack/$FILE_NAME" \
            --title "CustomPack $VERSION" \
            --notes "Automatisch erstellt. SHA-256: $SHA256" \
            --target "$GITHUB_SHA"
          echo "Release $TAG wurde erstellt."

      - name: Hochgeladene Datei gegenprüfen
        if: steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          FILE_NAME: ${{ steps.prepare.outputs.file_name }}
          SHA256: ${{ steps.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$TAG" --pattern "$FILE_NAME" --dir "$RUNNER_TEMP/verify"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/verify/$FILE_NAME" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$SHA256" ]; then
            echo "::error::Die Release-Datei hat einen anderen SHA-256 ($ACTUAL) als erwartet ($SHA256)."
            exit 1
          fi
          echo "Release-Datei stimmt mit dem berechneten SHA-256 überein."

      - name: latest.json und version.txt aktualisieren
        if: steps.prepare.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          FILE_NAME: ${{ steps.prepare.outputs.file_name }}
          SHA256: ${{ steps.prepare.outputs.sha256 }}
          DOWNLOAD_URL: ${{ steps.prepare.outputs.download_url }}
        run: |
          python scripts/update_resourcepack.py finalize \
            --version "$VERSION" \
            --file-name "$FILE_NAME" \
            --sha256 "$SHA256" \
            --download-url "$DOWNLOAD_URL"
          cat latest.json

      - name: Änderungen ins Repository übertragen
        if: steps.prepare.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json version.txt
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu übertragen."
            exit 0
          fi
          git commit -m "Resource-Pack $VERSION veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aufräumen bei Fehler (Release wieder löschen)
        if: failure() && steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          echo "Ein Schritt ist fehlgeschlagen - lösche die unvollständige Release $TAG."
          gh release delete "$TAG" --cleanup-tag --yes || true
